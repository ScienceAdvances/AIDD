name: Validate learning materials
on: [push, pull_request, workflow_dispatch]
jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r env/requirements-analysis.txt
      - run: python scripts/check_distribution.py
      - run: python practice.py verify
      - run: python practice.py analyze all --output runs/ci
